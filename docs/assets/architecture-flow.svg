<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410" fill="none">
  <defs>
    <linearGradient id="archBg" x1="0" y1="0" x2="1200" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070B13"/>
      <stop offset="100%" stop-color="#0D1424"/>
    </linearGradient>
    <linearGradient id="layerStroke" x1="0" y1="0" x2="1128" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="410" rx="18" fill="url(#archBg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Header -->
  <text x="36" y="38" fill="#F8FAFC" font-family="Inter, -apple-system, sans-serif" font-size="17" font-weight="700">PolyBlue System Architecture</text>
  <text x="36" y="58" fill="#94A3B8" font-family="Inter, -apple-system, sans-serif" font-size="12.5">Local-first TypeScript monorepo bridging real-time control surfaces, zero-drift DSP synchronization, and native OS Bluetooth stacks.</text>

  <!-- Tier 1: Control Surfaces -->
  <g transform="translate(36, 78)">
    <rect width="1128" height="82" rx="14" fill="#0B111E" stroke="#22D3EE" stroke-opacity="0.3"/>
    <text x="16" y="22" fill="#22D3EE" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">LAYER 1 · CONTROL SURFACES</text>

    <rect x="16" y="32" width="262" height="38" rx="9" fill="#101B2E" stroke="#22D3EE" stroke-opacity="0.45"/>
    <text x="147" y="49" text-anchor="middle" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="12" font-weight="600">PolyBlue Studio UI</text>
    <text x="147" y="63" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="10">React 19 · 60fps Canvas · Web Audio</text>

    <rect x="294" y="32" width="262" height="38" rx="9" fill="#101B2E" stroke="#334155"/>
    <text x="425" y="49" text-anchor="middle" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="12" font-weight="600">Desktop Tray App</text>
    <text x="425" y="63" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="10">Electron · Tray Quick-Align &amp; Launch</text>

    <rect x="572" y="32" width="262" height="38" rx="9" fill="#101B2E" stroke="#334155"/>
    <text x="703" y="49" text-anchor="middle" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="12" font-weight="600">polyblue CLI</text>
    <text x="703" y="63" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="10">Scriptable SSH &amp; Headless Control</text>

    <rect x="850" y="32" width="262" height="38" rx="9" fill="#101B2E" stroke="#334155"/>
    <text x="981" y="49" text-anchor="middle" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="12" font-weight="600">LAN Companion Remote</text>
    <text x="981" y="63" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="10">Phone / Tablet Browser over Wi-Fi</text>
  </g>

  <!-- Bidirectional arrows Tier 1 <-> Tier 2 -->
  <g stroke="#22D3EE" stroke-opacity="0.7" stroke-width="1.6">
    <line x1="183" y1="160" x2="183" y2="186"/>
    <line x1="461" y1="160" x2="461" y2="186"/>
    <line x1="739" y1="160" x2="739" y2="186"/>
    <line x1="1017" y1="160" x2="1017" y2="186"/>
  </g>
  <rect x="468" y="163" width="264" height="20" rx="10" fill="#0B1B2B" stroke="#22D3EE" stroke-opacity="0.5"/>
  <text x="600" y="177" text-anchor="middle" fill="#67E8F9" font-family="ui-monospace, monospace" font-size="10" font-weight="600">REST API + REAL-TIME WEBSOCKET (:4720)</text>

  <!-- Tier 2: Core Daemon -->
  <g transform="translate(36, 188)">
    <rect width="1128" height="86" rx="14" fill="#0B1322" stroke="url(#layerStroke)" stroke-width="1.3"/>
    <text x="16" y="22" fill="#34D399" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">LAYER 2 · POLYBLUE CORE ENGINE (@polyblue/daemon + @polyblue/shared)</text>

    <rect x="16" y="33" width="262" height="41" rx="9" fill="#0E1D2D" stroke="#22D3EE" stroke-opacity="0.35"/>
    <text x="147" y="50" text-anchor="middle" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12" font-weight="600">Parallel HCI Connection Queue</text>
    <text x="147" y="65" text-anchor="middle" fill="#67E8F9" font-family="ui-monospace, monospace" font-size="10">Staggered Paging · Proximity Watchdog</text>

    <rect x="294" y="33" width="262" height="41" rx="9" fill="#0B221E" stroke="#10B981" stroke-opacity="0.45"/>
    <text x="425" y="50" text-anchor="middle" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12" font-weight="600">Zero-Drift Sync Solver</text>
    <text x="425" y="65" text-anchor="middle" fill="#34D399" font-family="ui-monospace, monospace" font-size="10">Delay Alignment · 2-State Kalman Filter</text>

    <rect x="572" y="33" width="262" height="41" rx="9" fill="#131932" stroke="#8B5CF6" stroke-opacity="0.4"/>
    <text x="703" y="50" text-anchor="middle" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12" font-weight="600">Codec &amp; RF Airtime Profiler</text>
    <text x="703" y="65" text-anchor="middle" fill="#C4B5FD" font-family="ui-monospace, monospace" font-size="10">9 Audio Codecs · Piconet Budget Guard</text>

    <rect x="850" y="33" width="262" height="41" rx="9" fill="#131B2B" stroke="#3B82F6" stroke-opacity="0.4"/>
    <text x="981" y="50" text-anchor="middle" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12" font-weight="600">Debounced Local State Store</text>
    <text x="981" y="65" text-anchor="middle" fill="#93C5FD" font-family="ui-monospace, monospace" font-size="10">~/.config/polyblue · JSON Export/Import</text>
  </g>

  <!-- Arrows Tier 2 -> Tier 3 -->
  <g stroke="#10B981" stroke-opacity="0.7" stroke-width="1.6">
    <line x1="183" y1="274" x2="183" y2="302"/>
    <line x1="461" y1="274" x2="461" y2="302"/>
    <line x1="739" y1="274" x2="739" y2="302"/>
    <line x1="1017" y1="274" x2="1017" y2="302"/>
  </g>

  <!-- Tier 3: Native OS Backends -->
  <g transform="translate(36, 304)">
    <rect width="1128" height="86" rx="14" fill="#0B111E" stroke="#10B981" stroke-opacity="0.3"/>
    <text x="16" y="22" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">LAYER 3 · CROSS-PLATFORM NATIVE DRIVERS &amp; AUDIO BRIDGES</text>

    <rect x="16" y="33" width="262" height="41" rx="9" fill="#101827" stroke="#334155"/>
    <text x="147" y="50" text-anchor="middle" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="12" font-weight="600">Linux Native Driver</text>
    <text x="147" y="65" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="10">BlueZ · PipeWire / PulseAudio Sink</text>

    <rect x="294" y="33" width="262" height="41" rx="9" fill="#101827" stroke="#334155"/>
    <text x="425" y="50" text-anchor="middle" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="12" font-weight="600">Windows 10/11 Driver</text>
    <text x="425" y="65" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="10">WinRT Bluetooth · WASAPI Bridge</text>

    <rect x="572" y="33" width="262" height="41" rx="9" fill="#101827" stroke="#334155"/>
    <text x="703" y="50" text-anchor="middle" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="12" font-weight="600">macOS Native Driver</text>
    <text x="703" y="65" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="10">CoreBluetooth · CoreAudio Aggregate</text>

    <rect x="850" y="33" width="262" height="41" rx="9" fill="#0E2030" stroke="#22D3EE" stroke-opacity="0.4"/>
    <text x="981" y="50" text-anchor="middle" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="12" font-weight="600">Virtual BT 5.4 + Web BLE</text>
    <text x="981" y="65" text-anchor="middle" fill="#67E8F9" font-family="ui-monospace, monospace" font-size="10">Zero-Hardware Lab · Chrome/Edge GATT</text>
  </g>
</svg>
