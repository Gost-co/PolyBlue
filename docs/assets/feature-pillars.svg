<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" fill="none">
  <defs>
    <linearGradient id="bgCard" x1="0" y1="0" x2="280" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1424"/>
      <stop offset="100%" stop-color="#090E1A"/>
    </linearGradient>
    <linearGradient id="topCyan" x1="0" y1="0" x2="280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="topEmerald" x1="0" y1="0" x2="280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="topViolet" x1="0" y1="0" x2="280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="topAmber" x1="0" y1="0" x2="280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
  </defs>

  <!-- Card 1: Simultaneous Multi-Link -->
  <g transform="translate(8, 12)">
    <rect width="284" height="196" rx="16" fill="url(#bgCard)" stroke="#1E2B42" stroke-width="1.4"/>
    <rect x="20" y="0" width="244" height="3" rx="1.5" fill="url(#topCyan)"/>
    <rect x="20" y="22" width="40" height="40" rx="11" fill="#0B2235" stroke="#22D3EE" stroke-opacity="0.45"/>
    <path d="M32 34L48 50M40 29V55L48 47L32 34M40 29L48 37L32 50" stroke="#22D3EE" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="39" fill="#67E8F9" font-family="ui-monospace, monospace" font-size="11" font-weight="700">MULTI-LINK HCI</text>
    <text x="72" y="57" fill="#F8FAFC" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700">Up to 7+ Devices</text>
    <text x="20" y="92" fill="#94A3B8" font-family="Inter, -apple-system, sans-serif" font-size="12.5">Parallel staggered paging connects</text>
    <text x="20" y="110" fill="#94A3B8" font-family="Inter, -apple-system, sans-serif" font-size="12.5">headphones, speakers, keyboards,</text>
    <text x="20" y="128" fill="#94A3B8" font-family="Inter, -apple-system, sans-serif" font-size="12.5">mice &amp; BLE sensors simultaneously.</text>
    <rect x="20" y="150" width="244" height="28" rx="8" fill="#0A1322" stroke="#1E293B"/>
    <text x="142" y="168" text-anchor="middle" fill="#67E8F9" font-family="ui-monospace, monospace" font-size="11" font-weight="600">BT Classic · BLE · LE Audio 5.4</text>
  </g>

  <!-- Card 2: Zero-Drift Sync -->
  <g transform="translate(308, 12)">
    <rect width="284" height="196" rx="16" fill="url(#bgCard)" stroke="#1E2B42" stroke-width="1.4"/>
    <rect x="20" y="0" width="244" height="3" rx="1.5" fill="url(#topEmerald)"/>
    <rect x="20" y="22" width="40" height="40" rx="11" fill="#092620" stroke="#10B981" stroke-opacity="0.45"/>
    <path d="M27 42H33L36 33L41 51L45 38L48 42H53" stroke="#34D399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="39" fill="#34D399" font-family="ui-monospace, monospace" font-size="11" font-weight="700">KALMAN CLOCK LOCK</text>
    <text x="72" y="57" fill="#F8FAFC" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700">Δ 0.0 ms Phase Sync</text>
    <text x="20" y="92" fill="#94A3B8" font-family="Inter, -apple-system, sans-serif" font-size="12.5">Eliminates codec echo across LC3,</text>
    <text x="20" y="110" fill="#94A3B8" font-family="Inter, -apple-system, sans-serif" font-size="12.5">aptX, AAC, SBC &amp; LDAC while locking</text>
    <text x="20" y="128" fill="#94A3B8" font-family="Inter, -apple-system, sans-serif" font-size="12.5">crystal clock drift over multi-hour sets.</text>
    <rect x="20" y="150" width="244" height="28" rx="8" fill="#0A1322" stroke="#1E293B"/>
    <text x="142" y="168" text-anchor="middle" fill="#34D399" font-family="ui-monospace, monospace" font-size="11" font-weight="600">60fps Scope · ±1ms Fine Trim</text>
  </g>

  <!-- Card 3: Cross-Brand Stereo & EQ -->
  <g transform="translate(608, 12)">
    <rect width="284" height="196" rx="16" fill="url(#bgCard)" stroke="#1E2B42" stroke-width="1.4"/>
    <rect x="20" y="0" width="244" height="3" rx="1.5" fill="url(#topViolet)"/>
    <rect x="20" y="22" width="40" height="40" rx="11" fill="#1B1536" stroke="#8B5CF6" stroke-opacity="0.45"/>
    <line x1="32" y1="31" x2="32" y2="53" stroke="#A78BFA" stroke-width="2" stroke-linecap="round"/>
    <line x1="40" y1="31" x2="40" y2="53" stroke="#A78BFA" stroke-width="2" stroke-linecap="round"/>
    <line x1="48" y1="31" x2="48" y2="53" stroke="#A78BFA" stroke-width="2" stroke-linecap="round"/>
    <circle cx="32" cy="38" r="2.8" fill="#E2E8F0"/>
    <circle cx="40" cy="46" r="2.8" fill="#E2E8F0"/>
    <circle cx="48" cy="35" r="2.8" fill="#E2E8F0"/>
    <text x="72" y="39" fill="#C4B5FD" font-family="ui-monospace, monospace" font-size="11" font-weight="700">AUDIO MATRIX + EQ</text>
    <text x="72" y="57" fill="#F8FAFC" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700">Cross-Brand Stereo</text>
    <text x="20" y="92" fill="#94A3B8" font-family="Inter, -apple-system, sans-serif" font-size="12.5">Turn any two different speaker brands</text>
    <text x="20" y="110" fill="#94A3B8" font-family="Inter, -apple-system, sans-serif" font-size="12.5">into a synced Left / Right stage with</text>
    <text x="20" y="128" fill="#94A3B8" font-family="Inter, -apple-system, sans-serif" font-size="12.5">3-band EQ, Solo/Mute &amp; linked gain.</text>
    <rect x="20" y="150" width="244" height="28" rx="8" fill="#0A1322" stroke="#1E293B"/>
    <text x="142" y="168" text-anchor="middle" fill="#C4B5FD" font-family="ui-monospace, monospace" font-size="11" font-weight="600">L · R · Stereo · Mono · Sub</text>
  </g>

  <!-- Card 4: RF Radar, Scenes & Cross-OS -->
  <g transform="translate(908, 12)">
    <rect width="284" height="196" rx="16" fill="url(#bgCard)" stroke="#1E2B42" stroke-width="1.4"/>
    <rect x="20" y="0" width="244" height="3" rx="1.5" fill="url(#topAmber)"/>
    <rect x="20" y="22" width="40" height="40" rx="11" fill="#2A1A14" stroke="#F59E0B" stroke-opacity="0.45"/>
    <circle cx="40" cy="42" r="11" stroke="#FBBF24" stroke-opacity="0.45" stroke-width="1.6"/>
    <circle cx="40" cy="42" r="6" stroke="#FBBF24" stroke-opacity="0.7" stroke-width="1.6"/>
    <circle cx="40" cy="42" r="2.2" fill="#FBBF24"/>
    <line x1="40" y1="42" x2="48" y2="34" stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round"/>
    <text x="72" y="39" fill="#FCD34D" font-family="ui-monospace, monospace" font-size="11" font-weight="700">RADAR · GATT · LAN</text>
    <text x="72" y="57" fill="#F8FAFC" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700">Total Control Suite</text>
    <text x="20" y="92" fill="#94A3B8" font-family="Inter, -apple-system, sans-serif" font-size="12.5">Interactive RF radar, BLE GATT UUID</text>
    <text x="20" y="110" fill="#94A3B8" font-family="Inter, -apple-system, sans-serif" font-size="12.5">explorer, one-click Scenes, CLI, tray</text>
    <text x="20" y="128" fill="#94A3B8" font-family="Inter, -apple-system, sans-serif" font-size="12.5">app &amp; Wi-Fi phone companion remote.</text>
    <rect x="20" y="150" width="244" height="28" rx="8" fill="#0A1322" stroke="#1E293B"/>
    <text x="142" y="168" text-anchor="middle" fill="#FCD34D" font-family="ui-monospace, monospace" font-size="11" font-weight="600">Win · Linux · macOS · Web BLE</text>
  </g>
</svg>
