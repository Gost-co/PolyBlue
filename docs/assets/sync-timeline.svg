<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" fill="none">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1200" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#0E1525"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="440" rx="18" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Header -->
  <text x="36" y="42" fill="#F8FAFC" font-family="Inter, -apple-system, sans-serif" font-size="18" font-weight="700">How PolyBlue Eliminates Multi-Device Audio Time Difference</text>
  <text x="36" y="64" fill="#94A3B8" font-family="Inter, -apple-system, sans-serif" font-size="13">Mixed Bluetooth codecs naturally play at different times. PolyBlue injects exact per-link delay buffers + Kalman drift lock so all ears hear 0.0 ms delta.</text>

  <!-- Left Panel: WITHOUT POLYBLUE -->
  <g transform="translate(36, 92)">
    <rect width="546" height="314" rx="14" fill="#0B101C" stroke="#F59E0B" stroke-opacity="0.35" stroke-width="1.3"/>
    <rect x="16" y="16" width="212" height="24" rx="12" fill="#2A1D0D" stroke="#F59E0B" stroke-opacity="0.5"/>
    <text x="122" y="32" text-anchor="middle" fill="#FBBF24" font-family="ui-monospace, monospace" font-size="11" font-weight="700">WITHOUT SYNC · 174 MS ECHO</text>

    <!-- Time Grid -->
    <text x="160" y="62" fill="#64748B" font-family="ui-monospace, monospace" font-size="10">0ms</text>
    <text x="275" y="62" fill="#64748B" font-family="ui-monospace, monospace" font-size="10">100ms</text>
    <text x="415" y="62" fill="#64748B" font-family="ui-monospace, monospace" font-size="10">200ms</text>

    <line x1="160" y1="70" x2="160" y2="262" stroke="#1E293B"/>
    <line x1="290" y1="70" x2="290" y2="262" stroke="#1E293B" stroke-dasharray="3 3"/>
    <line x1="420" y1="70" x2="420" y2="262" stroke="#1E293B" stroke-dasharray="3 3"/>

    <!-- Row 1: LC3 22ms -->
    <text x="18" y="102" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12.5" font-weight="600">AirPods Pro 2</text>
    <text x="18" y="118" fill="#64748B" font-family="ui-monospace, monospace" font-size="10.5">LC3 · 22ms</text>
    <rect x="160" y="88" width="29" height="22" rx="6" fill="#3B82F6"/>
    <circle cx="189" cy="99" r="5" fill="#FBBF24"/>
    <text x="200" y="103" fill="#FBBF24" font-family="ui-monospace, monospace" font-size="10.5">Plays 174ms early!</text>

    <!-- Row 2: aptX Adaptive 68ms -->
    <text x="18" y="154" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12.5" font-weight="600">Bose QC Ultra</text>
    <text x="18" y="170" fill="#64748B" font-family="ui-monospace, monospace" font-size="10.5">aptX Adap · 68ms</text>
    <rect x="160" y="140" width="88" height="22" rx="6" fill="#3B82F6"/>
    <circle cx="248" cy="151" r="5" fill="#FBBF24"/>
    <text x="259" y="155" fill="#FBBF24" font-family="ui-monospace, monospace" font-size="10.5">Plays 128ms early!</text>

    <!-- Row 3: AAC 148ms -->
    <text x="18" y="206" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12.5" font-weight="600">JBL Charge 5</text>
    <text x="18" y="222" fill="#64748B" font-family="ui-monospace, monospace" font-size="10.5">AAC · 148ms</text>
    <rect x="160" y="192" width="192" height="22" rx="6" fill="#3B82F6"/>
    <circle cx="352" cy="203" r="5" fill="#FBBF24"/>
    <text x="363" y="207" fill="#FBBF24" font-family="ui-monospace, monospace" font-size="10.5">48ms early!</text>

    <!-- Row 4: LDAC 196ms -->
    <text x="18" y="254" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12.5" font-weight="600">Sony XM5</text>
    <text x="18" y="270" fill="#64748B" font-family="ui-monospace, monospace" font-size="10.5">LDAC · 196ms</text>
    <rect x="160" y="240" width="255" height="22" rx="6" fill="#3B82F6"/>
    <circle cx="415" cy="251" r="5" fill="#FB7185"/>
    <text x="426" y="255" fill="#FDA4AF" font-family="ui-monospace, monospace" font-size="10.5">Slowest</text>

    <text x="18" y="298" fill="#F59E0B" font-family="Inter, sans-serif" font-size="12">Result: Severe double-sound echo &amp; phasing across headphones and speakers.</text>
  </g>

  <!-- Right Panel: WITH POLYBLUE -->
  <g transform="translate(618, 92)">
    <rect width="546" height="314" rx="14" fill="#0B101C" stroke="#10B981" stroke-opacity="0.45" stroke-width="1.3"/>
    <rect x="16" y="16" width="258" height="24" rx="12" fill="#0A231C" stroke="#10B981" stroke-opacity="0.55"/>
    <text x="145" y="32" text-anchor="middle" fill="#34D399" font-family="ui-monospace, monospace" font-size="11" font-weight="700">WITH POLYBLUE · Δ 0.0 MS LOCKED</text>

    <!-- Legend -->
    <rect x="308" y="22" width="12" height="10" rx="3" fill="#3B82F6"/>
    <text x="326" y="31" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="10">Codec</text>
    <rect x="378" y="22" width="12" height="10" rx="3" fill="#10B981"/>
    <text x="396" y="31" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="10">PolyBlue Delay</text>

    <!-- Time Grid -->
    <text x="160" y="62" fill="#64748B" font-family="ui-monospace, monospace" font-size="10">0ms</text>
    <text x="275" y="62" fill="#64748B" font-family="ui-monospace, monospace" font-size="10">100ms</text>
    <text x="415" y="62" fill="#34D399" font-family="ui-monospace, monospace" font-size="10" font-weight="700">208.0ms TARGET</text>

    <line x1="160" y1="70" x2="160" y2="266" stroke="#1E293B"/>
    <line x1="290" y1="70" x2="290" y2="266" stroke="#1E293B" stroke-dasharray="3 3"/>
    <!-- Master Clock Target Line -->
    <line x1="430" y1="68" x2="430" y2="270" stroke="#10B981" stroke-width="2" stroke-dasharray="5 4"/>

    <!-- Row 1: LC3 22ms + 186ms = 208ms -->
    <text x="18" y="102" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12.5" font-weight="600">AirPods Pro 2</text>
    <text x="18" y="118" fill="#6EE7B7" font-family="ui-monospace, monospace" font-size="10.5">22 + 186ms</text>
    <rect x="160" y="88" width="29" height="22" rx="4" fill="#3B82F6"/>
    <rect x="190" y="88" width="240" height="22" rx="4" fill="#10B981"/>
    <circle cx="430" cy="99" r="5.5" fill="#6EE7B7"/>
    <text x="444" y="103" fill="#34D399" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Δ 0.0ms</text>

    <!-- Row 2: aptX Adaptive 68ms + 140ms = 208ms -->
    <text x="18" y="154" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12.5" font-weight="600">Bose QC Ultra</text>
    <text x="18" y="170" fill="#6EE7B7" font-family="ui-monospace, monospace" font-size="10.5">68 + 140ms</text>
    <rect x="160" y="140" width="88" height="22" rx="4" fill="#3B82F6"/>
    <rect x="249" y="140" width="181" height="22" rx="4" fill="#10B981"/>
    <circle cx="430" cy="151" r="5.5" fill="#6EE7B7"/>
    <text x="444" y="155" fill="#34D399" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Δ 0.0ms</text>

    <!-- Row 3: AAC 148ms + 60ms = 208ms -->
    <text x="18" y="206" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12.5" font-weight="600">JBL Charge 5</text>
    <text x="18" y="222" fill="#6EE7B7" font-family="ui-monospace, monospace" font-size="10.5">148 + 60ms</text>
    <rect x="160" y="192" width="192" height="22" rx="4" fill="#3B82F6"/>
    <rect x="353" y="192" width="77" height="22" rx="4" fill="#10B981"/>
    <circle cx="430" cy="203" r="5.5" fill="#6EE7B7"/>
    <text x="444" y="207" fill="#34D399" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Δ 0.0ms</text>

    <!-- Row 4: LDAC 196ms + 12ms = 208ms -->
    <text x="18" y="254" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12.5" font-weight="600">Sony XM5</text>
    <text x="18" y="270" fill="#6EE7B7" font-family="ui-monospace, monospace" font-size="10.5">196 + 12ms</text>
    <rect x="160" y="240" width="255" height="22" rx="4" fill="#3B82F6"/>
    <rect x="416" y="240" width="14" height="22" rx="4" fill="#10B981"/>
    <circle cx="430" cy="251" r="5.5" fill="#6EE7B7"/>
    <text x="444" y="255" fill="#34D399" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Δ 0.0ms</text>

    <text x="18" y="298" fill="#34D399" font-family="Inter, sans-serif" font-size="12">Result: All 4 Bluetooth outputs fire on the exact same millisecond with zero echo.</text>
  </g>
</svg>
