<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="55%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#091522"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="76%" cy="50%" r="36%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#2563EB" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#070A12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowEmerald" cx="20%" cy="20%" r="30%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#070A12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" stroke="#1E293B" stroke-opacity="0.38" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Canvas & Grid -->
  <rect width="1280" height="420" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="22" fill="url(#grid)"/>
  <rect width="1280" height="420" rx="22" fill="url(#glowCyan)"/>
  <rect width="1280" height="420" rx="22" fill="url(#glowEmerald)"/>
  <rect x="1" y="1" width="1278" height="418" rx="21" stroke="#22D3EE" stroke-opacity="0.22" stroke-width="2"/>

  <!-- Left Content Column -->
  <!-- Status Pill -->
  <rect x="64" y="54" width="298" height="30" rx="15" fill="#0F1B2D" stroke="#10B981" stroke-opacity="0.45" stroke-width="1.2"/>
  <circle cx="82" cy="69" r="4.5" fill="#10B981"/>
  <text x="96" y="73" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" letter-spacing="0.6">ZERO-DRIFT SYNC ENGINE · Δ 0.0 MS</text>

  <!-- Logo Mark + Title -->
  <g transform="translate(64, 108)">
    <rect width="62" height="62" rx="16" fill="#0E1729" stroke="#22D3EE" stroke-opacity="0.45" stroke-width="1.8"/>
    <path d="M21 20L40 41L30 50V12L40 21L21 42" stroke="#22D3EE" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="48" cy="21" r="3.8" fill="#10B981"/>
    <circle cx="48" cy="42" r="3.8" fill="#3B82F6"/>
    <path d="M48 26V37" stroke="#22D3EE" stroke-opacity="0.6" stroke-width="1.8" stroke-dasharray="2 3"/>

    <text x="80" y="45" fill="#F8FAFC" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">PolyBlue</text>
  </g>

  <!-- Tagline -->
  <text x="64" y="212" fill="#E2E8F0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="600">
    Simultaneous Multi-Device Bluetooth &amp; Precision Audio Sync
  </text>
  <text x="64" y="244" fill="#94A3B8" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15.5">
    Connect multiple headphones, speakers, HID peripherals, and BLE sensors at the
  </text>
  <text x="64" y="268" fill="#94A3B8" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15.5">
    same time — eliminating codec delay &amp; clock drift across Windows, Linux, and macOS.
  </text>

  <!-- Platform & Feature Pills -->
  <g transform="translate(64, 304)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">
    <rect x="0" y="0" width="118" height="34" rx="10" fill="#111C30" stroke="#334155"/>
    <text x="59" y="21" text-anchor="middle" fill="#E2E8F0">WINDOWS 10/11</text>

    <rect x="130" y="0" width="112" height="34" rx="10" fill="#111C30" stroke="#334155"/>
    <text x="186" y="21" text-anchor="middle" fill="#E2E8F0">LINUX BLUEZ</text>

    <rect x="254" y="0" width="120" height="34" rx="10" fill="#111C30" stroke="#334155"/>
    <text x="314" y="21" text-anchor="middle" fill="#E2E8F0">MACOS AUDIO</text>

    <rect x="386" y="0" width="136" height="34" rx="10" fill="#0D2234" stroke="#22D3EE" stroke-opacity="0.45"/>
    <text x="454" y="21" text-anchor="middle" fill="#67E8F9">WEB BLUETOOTH</text>
  </g>

  <!-- Bottom Accent Hairline -->
  <rect x="64" y="366" width="522" height="3" rx="1.5" fill="url(#accentLine)" opacity="0.8"/>

  <!-- Right Column: Multi-Device Synchronized Topology Diagram -->
  <g transform="translate(720, 44)">
    <!-- Outer radar rings -->
    <circle cx="245" cy="166" r="146" stroke="#22D3EE" stroke-opacity="0.14" stroke-width="1.2"/>
    <circle cx="245" cy="166" r="98" stroke="#22D3EE" stroke-opacity="0.18" stroke-width="1.2" stroke-dasharray="4 5"/>
    <circle cx="245" cy="166" r="52" stroke="#22D3EE" stroke-opacity="0.28" stroke-width="1.4"/>

    <!-- Active Sync Beams -->
    <line x1="245" y1="166" x2="112" y2="74" stroke="#10B981" stroke-width="2" stroke-dasharray="6 4"/>
    <line x1="245" y1="166" x2="386" y2="76" stroke="#22D3EE" stroke-width="2" stroke-dasharray="6 4"/>
    <line x1="245" y1="166" x2="108" y2="262" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6 4"/>
    <line x1="245" y1="166" x2="390" y2="260" stroke="#A78BFA" stroke-width="2" stroke-dasharray="6 4"/>

    <!-- Center Host Adapter Hub -->
    <circle cx="245" cy="166" r="34" fill="#0B172A" stroke="#22D3EE" stroke-width="2.2"/>
    <text x="245" y="162" text-anchor="middle" fill="#22D3EE" font-family="ui-monospace, monospace" font-size="11" font-weight="700">HOST BT</text>
    <text x="245" y="177" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="10">5.4 HUB</text>

    <!-- Node 1: LDAC Headphones -->
    <rect x="16" y="34" width="176" height="58" rx="12" fill="#0F1828" stroke="#10B981" stroke-opacity="0.55" stroke-width="1.4"/>
    <circle cx="34" cy="54" r="4.5" fill="#10B981"/>
    <text x="46" y="58" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="12.5" font-weight="600">Sony WH-1000XM5</text>
    <text x="30" y="77" fill="#6EE7B7" font-family="ui-monospace, monospace" font-size="10.5">LDAC 196ms +12ms → 208ms</text>

    <!-- Node 2: LC3 Earbuds -->
    <rect x="304" y="34" width="184" height="58" rx="12" fill="#0F1828" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="1.4"/>
    <circle cx="322" cy="54" r="4.5" fill="#22D3EE"/>
    <text x="334" y="58" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="12.5" font-weight="600">AirPods Pro 2</text>
    <text x="318" y="77" fill="#67E8F9" font-family="ui-monospace, monospace" font-size="10.5">LC3  22ms +186ms → 208ms</text>

    <!-- Node 3: Split Stereo Speaker L -->
    <rect x="16" y="236" width="176" height="58" rx="12" fill="#0F1828" stroke="#3B82F6" stroke-opacity="0.55" stroke-width="1.4"/>
    <circle cx="34" cy="256" r="4.5" fill="#3B82F6"/>
    <text x="46" y="260" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="12.5" font-weight="600">JBL Charge 5 (L)</text>
    <text x="30" y="279" fill="#93C5FD" font-family="ui-monospace, monospace" font-size="10.5">SBC 186ms  +22ms → 208ms</text>

    <!-- Node 4: BLE Peripheral -->
    <rect x="304" y="236" width="184" height="58" rx="12" fill="#0F1828" stroke="#A78BFA" stroke-opacity="0.55" stroke-width="1.4"/>
    <circle cx="322" cy="256" r="4.5" fill="#A78BFA"/>
    <text x="334" y="260" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="12.5" font-weight="600">Keychron + Polar BLE</text>
    <text x="318" y="279" fill="#C4B5FD" font-family="ui-monospace, monospace" font-size="10.5">GATT 5.3 · Concurrent Link</text>

    <!-- Bottom Lock Metric Pill -->
    <rect x="148" y="308" width="196" height="28" rx="14" fill="#0A1E1B" stroke="#10B981" stroke-opacity="0.5"/>
    <text x="246" y="326" text-anchor="middle" fill="#34D399" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">4 LINKS ACTIVE · PHASE Δ 0.0ms</text>
  </g>
</svg>
